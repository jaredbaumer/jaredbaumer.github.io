<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-1 Journal Entry Converter — SumIt</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --primary:   #0F4C81;
      --accent:    #00A878;
      --light-bg:  #EEF7F3;
      --dark-text: #1A202C;
      --pass:      #16A34A;
      --fail:      #DC2626;
      --warn:      #D97706;
      --border:    #CBD5E0;
      --muted:     #718096;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #F7FAFC; color: var(--dark-text); font-size: 14px; }

    /* ── top nav ── */
    .topbar {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .topbar a.back {
      color: rgba(255,255,255,.8);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color .15s;
    }
    .topbar a.back:hover { color: white; }
    .topbar .divider { color: rgba(255,255,255,.35); font-size: 16px; }
    .topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: .01em; }

    /* ── main ── */
    main { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }

    /* ── step cards ── */
    .step {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .step-header {
      background: var(--light-bg);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .step-num {
      background: var(--primary);
      color: white;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
    }
    .step-title { font-weight: 600; font-size: 14px; color: var(--primary); }
    .step-body { padding: 20px; }

    /* ── upload zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: var(--accent); background: var(--light-bg); }
    .drop-zone svg { color: var(--muted); margin-bottom: 8px; }
    .drop-zone p { color: var(--muted); font-size: 13px; }
    .drop-zone p strong { color: var(--primary); }
    #file-input { display: none; }

    /* ── buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s, background .15s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:not(:disabled):hover { background: #009b6d; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
    }
    .btn-outline:not(:disabled):hover { background: var(--light-bg); }

    /* ── summary grid ── */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta-card {
      background: var(--light-bg);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .meta-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .meta-card .value { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 2px; }
    .meta-card .sub   { font-size: 11px; color: var(--muted); }

    /* ── QA grid ── */
    .qa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .qa-card {
      border-radius: 8px;
      padding: 14px 16px;
      border: 1px solid var(--border);
    }
    .qa-card.pass { border-left: 4px solid var(--pass); }
    .qa-card.fail { border-left: 4px solid var(--fail); }
    .qa-card.warn { border-left: 4px solid var(--warn); }
    .qa-card .qa-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .qa-card .qa-status {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    }
    .qa-card.pass .qa-status { color: var(--pass); }
    .qa-card.fail .qa-status { color: var(--fail); }
    .qa-card.warn .qa-status { color: var(--warn); }
    .qa-card .qa-detail { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── all-pass banner ── */
    .all-pass-banner {
      background: #DCFCE7;
      border: 1px solid #86EFAC;
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--pass);
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .all-fail-banner {
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--fail);
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── filter bar ── */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    .filter-bar select, .filter-bar input {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--dark-text);
    }
    .filter-bar label { font-size: 13px; color: var(--muted); }

    /* ── table ── */
    .tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    thead tr { background: var(--primary); color: white; }
    thead th { padding: 9px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
    tbody tr:nth-child(even) { background: #F7FAFC; }
    tbody td { padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .row-count { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* ── hidden ── */
    .hidden { display: none !important; }

    /* ── spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
  </style>
</head>
<body>

<nav class="topbar">
  <a class="back" href="../../index.html">← Hub</a>
  <span class="divider">|</span>
  <h1>K-1 Journal Entry Converter</h1>
</nav>

<main>

  <!-- STEP 1: Upload -->
  <div class="step" id="step1">
    <div class="step-header">
      <div class="step-num">1</div>
      <div class="step-title">Upload K-1 CSV</div>
    </div>
    <div class="step-body">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p><strong>Click to browse</strong> or drag &amp; drop your K-1 CSV here</p>
        <p id="file-name-display" style="margin-top:6px;font-weight:600;color:var(--primary)"></p>
      </div>
      <input type="file" id="file-input" accept=".csv" />
    </div>
  </div>

  <!-- STEP 2: Input Summary -->
  <div class="step hidden" id="step2">
    <div class="step-header">
      <div class="step-num">2</div>
      <div class="step-title">Input Summary</div>
    </div>
    <div class="step-body">
      <div class="meta-grid" id="summary-grid"></div>
      <div id="fund-list" style="font-size:12px;color:var(--muted);margin-bottom:16px;"></div>
      <button class="btn btn-primary" id="btn-convert">
        Run Conversion
      </button>
    </div>
  </div>

  <!-- STEP 3: QA -->
  <div class="step hidden" id="step3">
    <div class="step-header">
      <div class="step-num">3</div>
      <div class="step-title">QA &amp; Validation</div>
    </div>
    <div class="step-body">
      <div id="qa-banner"></div>
      <div class="qa-grid" id="qa-grid"></div>
    </div>
  </div>

  <!-- STEP 4: Preview & Download -->
  <div class="step hidden" id="step4">
    <div class="step-header">
      <div class="step-num">4</div>
      <div class="step-title">Preview &amp; Download</div>
    </div>
    <div class="step-body">
      <div class="filter-bar">
        <label>Filter by JE:</label>
        <select id="filter-je"><option value="">All</option></select>
        <label>Filter by Entity:</label>
        <select id="filter-entity"><option value="">All</option></select>
        <button class="btn btn-outline" id="btn-reset-filters">Reset</button>
        <button class="btn btn-primary" id="btn-download" style="margin-left:auto">
          ↓ Download CSV
        </button>
      </div>
      <div class="tbl-wrap">
        <table id="output-table">
          <thead>
            <tr>
              <th>JE Number</th><th>Entity Name</th><th>Effective Date</th>
              <th>Account Name</th><th class="num">Debits</th><th class="num">Credits</th>
              <th>Account Code</th><th>Description</th><th>Tags</th>
            </tr>
          </thead>
          <tbody id="output-body"></tbody>
        </table>
      </div>
      <p class="row-count" id="row-count"></p>
    </div>
  </div>

</main>

<script>
// ─────────────────────────────────────────
// Constants matching k1_converter/app.py
// ─────────────────────────────────────────
const ROW_ACCOUNT_CODE  = 0;
const ROW_ENTITY        = 1;
const ROW_EFFECTIVE_DATE= 2;
const ROW_DEBIT_CREDIT  = 3;
const ROW_JE_NUMBER     = 4;
const ROW_DESCRIPTION   = 5;
const ROW_TAGS          = 6;
const ROW_DATA_START    = 8;
const OUTPUT_COLS = ["Journal Entry Number","Entity Name","Effective Date",
                     "Account Name","Debits","Credits","Account Code","Description","Tags"];

let rawData = [];    // parsed CSV rows (array of arrays)
let outputRows = []; // converted JE rows

// ─────────────────────────────────────────
// Reset on page show (handles browser back)
// ─────────────────────────────────────────
window.addEventListener('pageshow', () => {
  rawData = [];
  outputRows = [];
  document.getElementById('file-input').value = '';
  document.getElementById('file-name-display').textContent = '';
  ['step2','step3','step4'].forEach(id => document.getElementById(id).classList.add('hidden'));
});

// ─────────────────────────────────────────
// File upload
// ─────────────────────────────────────────
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  if (!file.name.endsWith('.csv')) { alert('Please upload a .csv file.'); return; }
  document.getElementById('file-name-display').textContent = '📄 ' + file.name;
  Papa.parse(file, {
    skipEmptyLines: false,
    complete(results) {
      rawData = results.data;
      showSummary();
    },
    error(err) { alert('CSV parse error: ' + err.message); }
  });
}

// ─────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────
function parseAmount(val) {
  if (val === null || val === undefined || val === '') return 0;
  const s = String(val).replace(/,/g,'').trim();
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function cell(row, col) {
  if (!rawData[row]) return '';
  return (rawData[row][col] ?? '').toString().trim();
}

function fundColumns() {
  // Columns 1+ that have a valid Debits/Credits label in ROW_DEBIT_CREDIT
  const cols = [];
  const maxCol = Math.max(...rawData.map(r => r.length));
  for (let c = 1; c < maxCol; c++) {
    const lbl = cell(ROW_DEBIT_CREDIT, c).toLowerCase();
    if (lbl === 'debits' || lbl === 'credits') cols.push(c);
  }
  return cols;
}

// ─────────────────────────────────────────
// Step 2 — Input Summary
// ─────────────────────────────────────────
function showSummary() {
  const cols = fundColumns();
  const dataRows = rawData.slice(ROW_DATA_START).filter(r =>
    r.some(v => v !== null && v !== undefined && v.toString().trim() !== '')
  );
  const entities  = [...new Set(cols.map(c => cell(ROW_ENTITY, c)).filter(Boolean))];
  const dates     = [...new Set(cols.map(c => cell(ROW_EFFECTIVE_DATE, c)).filter(Boolean))];

  const grid = document.getElementById('summary-grid');
  grid.innerHTML = `
    <div class="meta-card">
      <div class="label">Fund Columns</div>
      <div class="value">${cols.length}</div>
    </div>
    <div class="meta-card">
      <div class="label">Data Rows</div>
      <div class="value">${dataRows.length}</div>
    </div>
    <div class="meta-card">
      <div class="label">Entities</div>
      <div class="value">${entities.length}</div>
    </div>
    <div class="meta-card">
      <div class="label">Effective Dates</div>
      <div class="value">${dates.length}</div>
      <div class="sub">${dates.join(', ')}</div>
    </div>
  `;

  document.getElementById('fund-list').textContent =
    cols.length ? 'Funds: ' + cols.map(c => cell(ROW_ENTITY, c) || `col${c}`).join(' · ') : '';

  document.getElementById('step2').classList.remove('hidden');
  document.getElementById('step3').classList.add('hidden');
  document.getElementById('step4').classList.add('hidden');
}

// ─────────────────────────────────────────
// Step 3 — Conversion + QA
// ─────────────────────────────────────────
document.getElementById('btn-convert').addEventListener('click', () => {
  outputRows = convertToJournalEntries(rawData);
  const qa   = runQA(rawData, outputRows);
  showQA(qa);
  showPreview(outputRows);
  document.getElementById('step3').classList.remove('hidden');
  document.getElementById('step4').classList.remove('hidden');
  document.getElementById('step3').scrollIntoView({ behavior: 'smooth' });
});

function convertToJournalEntries(df) {
  const cols = fundColumns();
  const rows = [];
  const dataRows = df.slice(ROW_DATA_START);

  for (const c of cols) {
    const debitCredit = cell(ROW_DEBIT_CREDIT, c).toLowerCase();
    const entity      = cell(ROW_ENTITY, c);
    const date        = cell(ROW_EFFECTIVE_DATE, c);
    const jeNum       = cell(ROW_JE_NUMBER, c);
    const desc        = cell(ROW_DESCRIPTION, c);
    const tags        = cell(ROW_TAGS, c);
    const acctCode    = cell(ROW_ACCOUNT_CODE, c);

    for (let r = 0; r < dataRows.length; r++) {
      const row  = dataRows[r];
      if (!row || row.every(v => v === null || v === undefined || v.toString().trim() === '')) continue;
      const acct = (row[0] ?? '').toString().trim();
      const raw  = row[c] ?? '';
      const amt  = parseAmount(raw);
      if (amt <= 0) continue;
      if (!acct) continue;

      const jeRow = {
        "Journal Entry Number": jeNum,
        "Entity Name":          entity,
        "Effective Date":       date,
        "Account Name":         acct,
        "Debits":               debitCredit === 'debits'  ? amt : 0,
        "Credits":              debitCredit === 'credits' ? amt : 0,
        "Account Code":         acctCode,
        "Description":          desc,
        "Tags":                 tags
      };
      rows.push(jeRow);
    }
  }
  return rows;
}

// ─────────────────────────────────────────
// QA Checks (mirrors app.py run_qa)
// ─────────────────────────────────────────
function runQA(df, out) {
  const results = [];
  const eps = 0.01; // floating point tolerance

  // 1. Grand Total Reconciliation
  const totalDeb = out.reduce((s,r) => s + r["Debits"],  0);
  const totalCrd = out.reduce((s,r) => s + r["Credits"], 0);
  const diff1 = Math.abs(totalDeb - totalCrd);
  results.push({
    name:   'Grand Total Reconciliation',
    pass:   diff1 < eps,
    detail: diff1 < eps
      ? `Debits ${fmt(totalDeb)} = Credits ${fmt(totalCrd)}`
      : `Debits ${fmt(totalDeb)} ≠ Credits ${fmt(totalCrd)} (diff ${fmt(diff1)})`
  });

  // 2. Per-JE Balance
  const jeMap = {};
  for (const r of out) {
    const k = r["Journal Entry Number"];
    if (!jeMap[k]) jeMap[k] = {deb:0, crd:0};
    jeMap[k].deb += r["Debits"];
    jeMap[k].crd += r["Credits"];
  }
  const failedJEs = Object.entries(jeMap).filter(([,v]) => Math.abs(v.deb - v.crd) >= eps);
  results.push({
    name:   'Per-JE Balance',
    pass:   failedJEs.length === 0,
    detail: failedJEs.length === 0
      ? `All ${Object.keys(jeMap).length} JEs balance to zero`
      : `${failedJEs.length} JE(s) out of balance: ${failedJEs.map(([k])=>k).join(', ')}`
  });

  // 3. Row Completeness
  const cols = fundColumns();
  const dataRows = df.slice(ROW_DATA_START).filter(r =>
    r.some(v => v !== null && v !== undefined && v.toString().trim() !== '')
  );
  let inputCellCount = 0;
  for (const c of cols) {
    for (const row of dataRows) {
      const v = row[c] ?? '';
      if (parseAmount(v) > 0) inputCellCount++;
    }
  }
  results.push({
    name:   'Row Completeness',
    pass:   inputCellCount === out.length,
    detail: inputCellCount === out.length
      ? `${out.length} input cells → ${out.length} output rows`
      : `Input cells with values: ${inputCellCount}, Output rows: ${out.length}`
  });

  // 4. Missing Values
  const requiredFields = ["Journal Entry Number","Entity Name","Effective Date",
                          "Account Name","Account Code","Description"];
  const missingRows = out.filter(r => requiredFields.some(f => !r[f] || r[f].toString().trim() === ''));
  results.push({
    name:   'Missing Values',
    pass:   missingRows.length === 0,
    detail: missingRows.length === 0
      ? 'No missing values in required fields'
      : `${missingRows.length} row(s) have blank required fields`
  });

  // 5. Input Structure
  const structErrors = [];
  for (const c of cols) {
    const lbl = cell(ROW_DEBIT_CREDIT, c);
    const je  = cell(ROW_JE_NUMBER, c);
    if (lbl !== 'Debits' && lbl !== 'Credits')
      structErrors.push(`Col ${c}: invalid label "${lbl}"`);
    if (!je)
      structErrors.push(`Col ${c}: missing JE number`);
  }
  results.push({
    name:   'Input Structure Validation',
    pass:   structErrors.length === 0,
    detail: structErrors.length === 0
      ? `All ${cols.length} fund columns have valid structure`
      : structErrors.slice(0,3).join('; ')
  });

  // 6. JE Count Consistency
  const uniqueJEs = new Set(out.map(r => r["Journal Entry Number"])).size;
  results.push({
    name:   'JE Count Consistency',
    pass:   uniqueJEs === cols.length,
    detail: uniqueJEs === cols.length
      ? `${uniqueJEs} unique JEs = ${cols.length} fund columns`
      : `${uniqueJEs} unique JEs ≠ ${cols.length} fund columns`
  });

  return results;
}

function showQA(checks) {
  const allPass = checks.every(c => c.pass);
  const banner  = document.getElementById('qa-banner');
  if (allPass) {
    banner.innerHTML = `<div class="all-pass-banner">✅ All 6 checks passed — file is ready to download</div>`;
  } else {
    const n = checks.filter(c => !c.pass).length;
    banner.innerHTML = `<div class="all-fail-banner">⚠️ ${n} check(s) failed — review before importing</div>`;
  }

  const grid = document.getElementById('qa-grid');
  grid.innerHTML = checks.map(c => `
    <div class="qa-card ${c.pass ? 'pass' : 'fail'}">
      <div class="qa-name">${c.name}</div>
      <div class="qa-status">${c.pass ? '✓ Pass' : '✗ Fail'}</div>
      <div class="qa-detail">${c.detail}</div>
    </div>
  `).join('');
}

// ─────────────────────────────────────────
// Step 4 — Preview table
// ─────────────────────────────────────────
function fmt(n) { return Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function showPreview(rows) {
  // Populate filter dropdowns
  const jes      = [...new Set(rows.map(r => r["Journal Entry Number"]).filter(Boolean))].sort();
  const entities = [...new Set(rows.map(r => r["Entity Name"]).filter(Boolean))].sort();

  const jeSelect = document.getElementById('filter-je');
  jeSelect.innerHTML = '<option value="">All</option>' +
    jes.map(j => `<option value="${j}">${j}</option>`).join('');

  const entSelect = document.getElementById('filter-entity');
  entSelect.innerHTML = '<option value="">All</option>' +
    entities.map(e => `<option value="${e}">${e}</option>`).join('');

  renderTable(rows);
}

function renderTable(rows) {
  const je  = document.getElementById('filter-je').value;
  const ent = document.getElementById('filter-entity').value;
  const filtered = rows.filter(r =>
    (!je  || r["Journal Entry Number"] === je) &&
    (!ent || r["Entity Name"] === ent)
  );

  const tbody = document.getElementById('output-body');
  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td>${r["Journal Entry Number"]}</td>
      <td>${r["Entity Name"]}</td>
      <td>${r["Effective Date"]}</td>
      <td>${r["Account Name"]}</td>
      <td class="num">${r["Debits"]  > 0 ? fmt(r["Debits"])  : ''}</td>
      <td class="num">${r["Credits"] > 0 ? fmt(r["Credits"]) : ''}</td>
      <td>${r["Account Code"]}</td>
      <td>${r["Description"]}</td>
      <td>${r["Tags"]}</td>
    </tr>
  `).join('');
  document.getElementById('row-count').textContent = `Showing ${filtered.length} of ${rows.length} rows`;
}

document.getElementById('filter-je').addEventListener('change',     () => renderTable(outputRows));
document.getElementById('filter-entity').addEventListener('change', () => renderTable(outputRows));
document.getElementById('btn-reset-filters').addEventListener('click', () => {
  document.getElementById('filter-je').value = '';
  document.getElementById('filter-entity').value = '';
  renderTable(outputRows);
});

// ─────────────────────────────────────────
// Download CSV
// ─────────────────────────────────────────
document.getElementById('btn-download').addEventListener('click', () => {
  if (!outputRows.length) return;
  const csv = Papa.unparse({ fields: OUTPUT_COLS, data: outputRows.map(r => OUTPUT_COLS.map(c => r[c])) });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'K1_Journal_Entry.csv';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
